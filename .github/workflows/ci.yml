name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Civilization.slnx

      - name: Build
        run: dotnet build Civilization.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Civilization.slnx --configuration Release --no-build --verbosity normal
